# Propiedades para los tests: SIEMPRE H2 en memoria, nunca Neon.
# (Este archivo reemplaza a src/main/resources/application.properties en el classpath de test.)
spring.r2dbc.url=r2dbc:h2:mem:///traiding_test?options=DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.sql.init.mode=always

# En tests no queremos red ni trading automático.
bot.feed=simulated
bot.auto-start=false
