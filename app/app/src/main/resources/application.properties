spring.application.name=app

# ---------- R2DBC + PostgreSQL (Neon) ----------
# Conexión a Neon (PostgreSQL) con SSL. Los datos persisten entre reinicios.
# Puedes sobreescribir sin tocar el código con las variables de entorno
# NEON_DB_URL / NEON_DB_USER / NEON_DB_PASSWORD.
spring.r2dbc.url=${NEON_DB_URL:r2dbc:postgresql://ep-super-king-b544eb5h.c-7.us-east-2.aws.neon.tech/neondb?sslMode=require}
spring.r2dbc.username=${NEON_DB_USER:neondb_owner}
spring.r2dbc.password=${NEON_DB_PASSWORD:npg_2x1KhmwfPAoQ}

# Pool de conexiones R2DBC.
spring.r2dbc.pool.enabled=true

# Crea las tablas al arrancar (schema.sql es idempotente).
spring.sql.init.mode=always

# ---------- Bot de trading ----------
# Feed de precios: simulated | binance
# Con 'binance' el bot opera con el precio spot real (API pública y gratuita, sin API keys).
bot.feed=binance
# Par operado
bot.symbol=BTCUSDT
# Intervalo de muestreo del precio (ms)
bot.poll-interval-ms=2000
# Comision por operacion (0.001 = 0.1%)
bot.fee-rate=0.001
# Precio inicial del simulador y volatilidad por tick
bot.initial-price=83000
bot.simulated-volatility=0.003
# Arrancar el bot automaticamente al levantar la app (opera sin abrir la web)
bot.auto-start=true

# ---------- Swagger UI (springdoc) ----------
# Interfaz: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------- Logging ----------
logging.level.com.traiding.app=INFO
